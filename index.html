document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

family:'Instrument Sans',sans-serif; display:flex; flex-direction:column; justify-content:space-between; padding:110px 130px; box-sizing:border-box\" data-om-slide-id=\"e55f034f\">\n  <div style=\"position:absolute; top:0; left:0; width:14px; height:1080px; background:#0A2A43\"><\u002Fdiv>\n  <div style=\"display:flex; align-items:center; gap:18px\">\n    <div style=\"width:52px; height:52px; border-radius:50%; background:#0A2A43; color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:600; letter-spacing:-0.03em\">xV<\u002Fdiv>\n    <div style=\"font-size:28px; font-weight:600; letter-spacing:-0.01em; color:#0A2A43\">xVector Labs<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:44px; max-width:1420px\">\n    <div style=\"font-size:136px; line-height:1.0; font-weight:600; letter-spacing:-0.045em; color:#0A2A43; text-wrap:balance\">The last mile from data to <span style=\"font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; letter-spacing:-0.02em\">outcome<\u002Fspan><\u002Fdiv>\n    <div style=\"width:200px; height:3px; background:#1E7FB8\"><\u002Fdiv>\n    <div style=\"font-size:42px; line-height:1.35; color:#3C4E5C; max-width:1240px; text-wrap:pretty\">Agent enabled apps built on your systems.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex; justify-content:flex-end; align-items:flex-end; font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.1em; text-transform:uppercase; color:#8593A0\">\n    <div>xvectorlabs.com<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute; bottom:28px; right:36px; font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:0.08em; color:#8593A0\">01 / 11<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Platform doesn't matter\" data-screen-label=\"02\" data-speaker-notes=\"State plainly what we are: a platform deployed in their cloud, with a team behind it. Then walk the three cards left to right.\" style=\"background:#FFFFFF; font-family:'Instrument Sans',sans-serif; display:flex; flex-direction:column; justify-content:center; gap:56px; padding:100px 130px; box-sizing:border-box\" data-om-slide-id=\"8ffac1e9\">\n  <div style=\"position:absolute; top:0; left:0; width:14px; height:1080px; background:#0A2A43\"><\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:28px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#1E7FB8\">Who we are<\u002Fdiv>\n    <div style=\"font-size:68px; line-height:1.15; font-weight:600; letter-spacing:-0.03em; max-width:1240px; text-wrap:balance; color:#0A2A43\">One platform. One methodology. Deployed in your environment.<\u002Fdiv>\n    <div style=\"width:120px; height:3px; background:#1E7FB8\"><\u002Fdiv>\n    <div style=\"font-size:38px; line-height:1.35; font-weight:600; letter-spacing:-0.01em; max-width:1200px; text-wrap:balance; color:#2A3B4A\">We build outcome-specific apps that move <span style=\"color:#1E7FB8\">your KPIs<\u002Fspan>.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid; grid-template-columns:1fr 48px 1fr 48px 1fr; align-items:stretch\">\n    <div style=\"background:#F7F9FB; border:1px solid #C9D3DC; padding:44px 36px; display:flex; flex-direction:column; gap:22px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#5A6A78\">Your systems of record<\u002Fdiv>\n      <div style=\"font-size:34px; line-height:1.2; font-weight:600; letter-spacing:-0.02em; color:#0A2A43\">The data exists, siloed, unmaintained, under-used.<\u002Fdiv>\n      <div style=\"margin-top:auto; font-size:24px; line-height:1.45; color:#5A6A78\">ERP · CRM · Data Platforms · Analytics · Planning<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; justify-content:center; font-size:42px; font-weight:600; color:#0A2A43\">›<\u002Fdiv>\n    <div style=\"background:#FBF0E9; border:1px solid #C2571B; padding:44px 40px; display:flex; flex-direction:column; gap:22px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#8A3814\">The last mile today<\u002Fdiv>\n      <div style=\"font-size:34px; line-height:1.2; font-weight:600; letter-spacing:-0.02em; color:#0A2A43\">No system drives the outcome you want.<\u002Fdiv>\n      <div style=\"margin-top:auto; font-size:24px; line-height:1.45; color:#7A3A22\">Costly, slow, wrong, or missing results.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; justify-content:center; font-size:42px; font-weight:600; color:#0A2A43\">›<\u002Fdiv>\n    <div style=\"background:#0A2A43; padding:44px 36px; display:flex; flex-direction:column; gap:22px; box-shadow:0 18px 44px rgba(10,42,67,0.28); position:relative\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#B8E7FA\">The last mile, solved<\u002Fdiv>\n      <div style=\"font-size:34px; line-height:1.2; font-weight:600; letter-spacing:-0.02em; color:#fff\">An app drives the outcome.<\u002Fdiv>\n      <div style=\"margin-top:auto; font-size:24px; line-height:1.45; color:#A8BECF\">Reliable, governed performance on the xVector platform.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute; bottom:28px; right:36px; font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:0.08em; color:#8593A0\">02 / 11<\u002Fdiv>\n<\u002Fsection>\n\n\n<section data-label=\"Act 1\" data-screen-label=\"03\" data-speaker-notes=\"Act break. One line: let me show you the job to be done, in any industry, and then in a real one.\" style=\"background:#0A2A43; font-family:'Instrument Sans',sans-serif; display:flex; flex-direction:column; justify-content:center; gap:36px; padding:110px 130px; box-sizing:border-box\" data-om-slide-id=\"a28b3b8b\">\n  <div style=\"font-family:'IBM Plex Mono',monospace; font-size:26px; letter-spacing:0.2em; text-transform:uppercase; color:#7FD4F5\">Act one<\u002Fdiv>\n  <div style=\"font-size:118px; line-height:1.05; font-weight:600; letter-spacing:-0.04em; color:#fff; max-width:1420px; text-wrap:balance\">The job to be <span style=\"font-family:'Instrument Serif',serif; font-style:italic; font-weight:400\">done<\u002Fspan><\u002Fdiv>\n  <div style=\"font-size:38px; line-height:1.4; color:#A8BECF; white-space:nowrap\">Case study: supply chain planning at a Fortune 500 semiconductor company.<\u002Fdiv>\n\n  <div style=\"position:absolute; bottom:28px; right:36px; font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:0.08em; color:rgba(255,255,255,0.45)\">03 / 11<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The moment\" data-screen-label=\"04\" data-speaker-notes=\"The forecast moved 41 percent in two weeks, and no two systems agreed on what to do about it. Walk left to right: real data proves the swing, the three manufacturer feeds don't share a schema, and the planner ends up reconciling conflicting numbers by hand.\" style=\"background:#FFFFFF; font-family:'Instrument Sans',sans-serif; display:flex; flex-direction:column; justify-content:center; gap:40px; padding:90px 120px; box-sizing:border-box\" data-om-slide-id=\"fca940eb\">\n  <div style=\"position:absolute; top:0; left:0; width:14px; height:1080px; background:#0A2A43\"><\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:16px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.16em; text-transform:uppercase; color:#1E7FB8\">The moment<\u002Fdiv>\n    <div style=\"font-size:66px; line-height:1.14; font-weight:600; letter-spacing:-0.035em; color:#0A2A43; max-width:1600px; text-wrap:balance\">Demand spiked 41%. Supply visibility was poor. No system to decide <span style=\"font-family:'Instrument Serif',serif; font-style:italic; font-weight:400\">what now.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:stretch; gap:12px\">\n    <div style=\"width:460px; flex:none; background:#fff; border:1px solid #C9D3DC; border-radius:10px; padding:28px 32px; display:flex; flex-direction:column; gap:18px\">\n      <div style=\"display:flex; flex-direction:column; gap:2px\">\n        <div style=\"font-size:24px; font-weight:600; color:#0A2A43\">Weekly demand · units<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:16px; letter-spacing:0.08em; text-transform:uppercase; color:#8593A0\">Product X<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:end; border-bottom:2px solid #0A2A43\">\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:8px\">\n          <div style=\"font-size:18px; font-weight:600; color:#0A2A43\">4,680<\u002Fdiv>\n          <div style=\"width:100%; height:117px; background:#0A2A43\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:8px\">\n          <div style=\"font-size:18px; font-weight:600; color:#0A2A43\">3,900<\u002Fdiv>\n          <div style=\"width:100%; height:40px; background:#9FB0BE\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:8px\">\n          <div style=\"font-size:18px; font-weight:600; color:#0A2A43\">4,320<\u002Fdiv>\n          <div style=\"width:100%; height:81px; background:#0A2A43\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:8px\">\n          <div style=\"font-size:18px; font-weight:600; color:#B8353A\">5,520<\u002Fdiv>\n          <div style=\"width:100%; height:200px; background:#B8353A\"><\u002Fdiv>\n        <\u002F ><div style=\"color:#87A2B8\">Normal<\u002Fdiv>\n          <div style=\"height:10px; background:rgba(255,255,255,0.12); border-radius:5px\"><div style=\"width:58%; height:10px; background:#7FD4F5; border-radius:5px\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1.1fr 1.1fr 0.9fr 1.4fr; align-items:center; font-size:24px; color:#E6EEF5; padding:16px 0; border-bottom:1px solid rgba(127,212,245,0.1)\">\n          <div>C19968<\u002Fdiv><div style=\"color:#87A2B8\">PADOSP_01<\u002Fdiv><div><span style=\"background:rgba(194,87,27,0.18); color:#C2571B; font-weight:600; padding:4px 10px; border-radius:4px\">Hold<\u002Fspan><\u002Fdiv>\n          <div style=\"height:10px; background:rgba(255,255,255,0.12); border-radius:5px\"><div style=\"width:34%; height:10px; background:#C2571B; border-radius:5px\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1.1fr 1.1fr 0.9fr 1.4fr; align-items:center; font-size:24px; color:#E6EEF5; padding:16px 0\">\n          <div>C19858<\u002Fdiv><div style=\"color:#87A2B8\">TM01C_01<\u002Fdiv><div><span style=\"background:rgba(255,138,142,0.18); color:#FF8A8E; font-weight:600; padding:4px 10px; border-radius:4px\">Critical<\u002Fspan><\u002Fdiv>\n          <div style=\"height:10px; background:rgba(255,255,255,0.12); border-radius:5px\"><div style=\"width:19%; height:10px; background:#FF8A8E; border-radius:5px\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(127,212,245,0.1); border-top:1px solid rgba(127,212,245,0.25); padding:26px 32px; display:flex; flex-direction:column; gap:12px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.12em; text-transform:uppercase; color:#7FD4F5\">Agentic insight<\u002Fdiv>\n        <div style=\"font-size:24px; line-height:1.5; color:#D5E3EE\">C19968 (Hold, 34% complete) and C19858 (Critical, 19% complete) are ng:22px 24px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:22px; letter-spacing:0.12em; text-transform:uppercase; color:#8593A0\">Step 1<\u002Fdiv>\n          <div style=\"font-size:28px; font-weight:600; line-height:1.2; letter-spacing:-0.02em; color:#0A2A43\">Detect the demand signal<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid #C9D3DC; border-top:5px solid #1E7FB8; padding:22px 24px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:22px; letter-spacing:0.12em; text-transform:uppercase; color:#8593A0\">Step 2<\u002Fdiv>\n          <div style=\"font-size:28px; font-weight:600; line-height:1.2; letter-spacing:-0.02em; color:#0A2A43\">Evaluate the supply pipeline<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff; border:1px solid #C9D3DC; border-top:5px solid #1E7FB8; padding:22px 24px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:22px; letter-spacing:0.12em; text-transform:uppercase; color:#8593A0\">Step 3<\u002Fdiv>\n          <div style=\"font-size:28px; font-weight:600; line-height:1.2; letter-spacing:-0.02em; color:#0A2A43\">Model the business impact<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; justify-content:center; font-size:48px; font-weight:700; color:#0A2A43\">▾<\u002Fdiv>\n      <div style=\"background:#0A2A43; padding:22px 32px; display:flex; flex-direction:column; gap:10px; position:relative; z-index:1\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:22px; letter-spacing:0.14em; text-transform:uppercase; color:#7FD4F5\">The agent recommends<\u002Fdiv>\n        <div style=\"font-size:36px; font-weight:600; letter-spacing:-0.025em; color:#fff\">One decision brief<\u002Fdiv>\n        <div style=\"font-size:2 etter-spacing:0.14em; text-transform:uppercase; color:#8593A0; flex:none\">Deliverable<\u002Fdiv>\n    <div style=\"font-size:34px; font-weight:600; letter-spacing:-0.02em; color:#0A2A43\">A working app in days, using synthetic data (or real data when available).<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute; bottom:28px; right:36px; font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:0.08em; color:#8593A0\">11 / 11<\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<section data-label=\"Appendix\" data-screen-label=\"A0\" data-speaker-notes=\"Appendix divider. Supporting detail for those who want to go deeper: the underlying capability library and the speed-to-build proof.\" style=\"background:#0A2A43; font-family:'Instrument Sans',sans-serif; display:flex; flex-direction:column; justify-content:center; gap:24px; padding:120px; box-sizing:border-box\">\n  <div style=\"font-family:'IBM Plex Mono',monospace; font-size:26px; letter-spacing:0.2em; text-transform:uppercase; color:#7FD4F5\">Appendix<\u002Fdiv>\n  <div style=\"font-size:118px; line-height:1.05; font-weight:600; letter-spacing:-0.04em; color:#fff; max-width:1420px; text-wrap:balance\">Go deeper.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Appx · Architecture\" data-screen-label=\"A1\" data-speaker-notes=\"One line: your systems in on the left, your systems written back to on the right, one platform boundary deployed in your cloud.\" style=\"background:#FFFFFF; font-family:'Instrument Sans',sans-serif; display:flex; flex-direction:column; gap:36px; padding:80px 110px; box-sizing:border-box\" data-om-slide-id=\"0222f49c\">\n  <div style=\"position:absolute; top:0; left:0; width:14px; height:1080px; background:#0A2A43\"><\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:10px; padding-left:20px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.16em; text-transform:uppercase; color:#1E7FB8\">Under the hood<\u002Fdiv>\n    <div style=\"font-size:68px; font-weight:600; letter-spacing:-0.03em; color:#0A2A43\">Platform architecture<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1; min-height:0; margin:0 20px 20px 20px; background:#F4F7FA; border:1px solid #C9D3DC; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; overflow:hidden\">\n    <img src=\"5228d8d5-273d-4ff4-9d75-69fcdb7da785\" alt=\"xVector platform architecture\" style=\"max-width:100%; max-height:100%; object-fit:contain\">\n  <\u002Fdiv>\n\n  <div style=\"position:absolute; bottom:28px; right:36px; font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:0.08em; color:#8593A0\">Appendix<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Capabilities\" data-screen-label=\"A2\" data-speaker-notes=\"Apps decompose into the same reusable capabilities, and each capability is assembled from platform building blocks, not written from scratch. Walk to the Score &amp; decide chip, then down into its four building blocks, then land on the routing decision from the planner app.\" style=\"background:#F4F7FA; font-family:'Instrument Sans',sans-serif; display:flex; flex-direction:column; gap:22px; padding:64px 130px; box-sizing:border-box; justify-content:center\" data-om-slide-id=\"40526ae2\">\n  <div style=\"position:absolute; top:0; left:0; width:14px; height:1080px; background:#0A2A43\"><\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:14px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace; font-size:24px; letter-spacing:0.16em; text-transform:uppercase; color:#1E7FB8\">How these apps are built<\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:20px\">\n      <div style=\"font-size:58px; font-weight:600; letter-spacing:-0.03em; color:#0A2A43\">Apps<\u002Fdiv>\n      <div style=\"font-size:44px; font-weight:700; color:#8FB4CE\">›<\u002Fdiv>\n      <div style=\"font-size:58px; font-weight:600; letter-spacing:-0.03em; color:#0A2A43\">Functional capabilities<\u002Fdiv>\n      <div style=\"font-size:44px; font-weight:700; color:#8FB4CE\">›<\u002Fdiv>\n      <div style=\"font-size:58px; font-weight:600; letter-spacing:-0.03em; color:#0A2A43\">Platform blocks<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:10px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace; font-size:18px; letter-spacing:0.12em; text-transform:uppercase; color:#1E7FB8\">Requirements · available capabilities<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:auto auto; gap:12px\">\n    <div style=\"background:#fff; border:1px solid #C9D3DC; padding:14px 18px; display:flex; flex-direction:column; gap:4px\">\n      <div style=\"font-size:24px; font-weight:600; letter-spacing:-0.02em; color:#0A2A43\">Ingest &amp; extract<\u002Fdiv>\n      <div style=\"font-size:18px; line-height:1.3; color:#5A6A78\">Turn documents and feeds into clean records.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff; border:1px solid #C9D3DC; padding:14px 18px; display:flex; flex-direction:column; gap:4px\">\n      <div style=\"font-size:24px; font-weight:600; letter-spacing:-0.02em; color:#0A2A43\">Classify &amp; code<\u002Fdiv>\n      <div style=\"font-size:18px; line-height:1.3; color:#5A6A78\">Apply your categories consistently, every time.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff; border:1px solid #C9D3DC; padding:14px 18px; display:flex; flex-direction:column; gap:4px\">\n      <div style=\"font-size:24px; font-weight:600; letter-spacing:-0.02em; color:#0A2A43\">Match &amp; reconcile<\u002Fdiv>\n      <div style=\"font-size:18px; line-height:1.3; color:#5A6A78\">Compare across systems and surface the breaks.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff; border:1px solid #C9D3DC; padding:14px 18px; display:flex; flex-direction:column; gap:4px\">\n      <div style=\"font-size:24px; font-weight:600; letter-spacing:-0.02em; color:#0A2A43\">Monitor &amp; alert<\u002Fdiv>\n      <div style=\"font-size:18px; line-height:1.3; color:#5A6A78\">Watch for anomalies and thresholds continuously.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff; border:1px solid #C9D3DC; padding:14px 18px; display:flex; flex-direction:column; gap:4px\">\n      <div style=\"font-size:24px; font-weight:600; letter-spacing:-0.02em; color:#0A2A43\">Forecast &amp; optimize<\u002Fdiv>\n      <div style=\"font-size:18px; line-height:1.3; color:#5A6A78\">Predict what happens next and pick the best move.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0A2A43; border:1px solid #0A2A43; padding:14px 18px; display:flex; flex-direction:column; align-items:center; gap:4px\">\n      <div style=\"font-size:24px; font-weight:700; letter-spacing:-0.02em; color:#fff\">Score &amp; decide<\u002Fdiv>\n      <div style=\"font-size:18px; line-height:1.3; color:#A8BECF\">Reach a decision or a risk score you can defend.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff; border:1px solid #C9D3DC; padding:14px 18px; display:flex; flex-direction:column; gap:4px\">\n      <div style=\"font-size:24px; font-weight:600; letter-spacing:-0.02em; color:#0A2A43\">Aggregate &amp; report<\u002Fdiv>\n      <div style=\"font-size:18px; line-height:1.3; color:#5A6A78\">Roll many sources into one validated view.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff; border:1px solid #C9D3DC; padding:14px 18px; display:flex; flex-direction:column; gap:4px\">\n      <div style=\"font-size:24px; font-weight:600; letter-spacing:-0.02em; color:#0A2A43\">Orchestrate &amp; act<\u002Fdiv>\n      <div style=\"font-size:18px; line-height:1.3; color:#5A6A78\">Carry out multi-step actions, with approval built in.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative; height:26px; width:100%\">\n    <div style=\"position:absolute; top:0; left:37.5%; width:2px; height:26px; background:#0A2A43; transform:translateX(-50%)\"><\u002Fdiv>\n    <div style=\"position:absolute; top:-4px; left:calc(37.5% + 16px); display:flex; align-items:center; gap:8px; background:#FCEFE3; border:1px solid #E8A46B; border-radius:20px; padding:5px 14px 5px 10px\">\n      <div style=\"width:8px; height:8px; border-radius:50%; background:#C2571B; flex:none\"><\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700; letter-spacing:0.04em; color:#9A431B; white-space:nowrap\">Example: Supply Chain Planner App (Semiconductor Co.)<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border:1px solid #C9D3DC; border-radius:14px; padding:26px 28px 28px; display:flex; flex-direction:column; gap:16px\">\n    <div style=\"font-family:'IBM Plex Mono',monospace; font-size:18px; letter-spacing:0.12em; text-transform:uppercase; color:#1E7FB8\">Platform · what it's assembled from<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:16px\">\n    <div style=\"background:#4B4A63; border-radius:10px; padding:20px 22px; display:flex; flex-direction:column; gap:8px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:18px; letter-spacing:0.1em; text-transform:uppercase; color:#C9C6DA\">Building block<\u002Fdiv>\n      <div style=\"font-size:26px; font-weight:600; letter-spacing:-0.02em; color:#fff\">Dataset<\u002Fdiv>\n      <div style=\"font-size:20px; line-height:1.35; color:#DBD8E8\">Work-in-progress and demand data, structured and versioned.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#4B4A63; border-radius:10px; padding:20px 22px; display:flex; flex-direction:column; gap:8px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:18px; letter-spacing:0.1em; text-transform:uppercase; color:#C9C6DA\">Building block<\u002Fdiv>\n      <div style=\"font-size:26px; font-weight:600; letter-spacing:-0.02em; color:#fff\">Model<\u002Fdiv>\n      <div style=\"font-size:20px; line-height:1.35; color:#DBD8E8\">Scores how material the change is and how urgent.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#4B4A63; border-radius:10px; padding:20px 22px; display:flex; flex-direction:column; gap:8px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:18px; letter-spacing:0.1em; text-transform:uppercase; color:#C9C6DA\">Building block<\u002Fdiv>\n      <div style=\"font-size:26px; font-weight:600; letter-spacing:-0.02em; color:#fff\">Agent core<\u002Fdiv>\n      <div style=\"font-size:20px; line-height:1.35; color:#DBD8E8\">Applies your rules: above $5M or 50K units, escalate to the VP.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#4B4A63; border-radius:10px; padding:20px 22px; display:flex; flex-direction:column; gap:8px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:18px; letter-spacing:0.1em; text-transform:uppercase; color:#C9C6DA\">Building block<\u002Fdiv>\n      <div style=\"font-size:26px; font-weight:600; letter-spacing:-0.02em; color:#fff\">Bounded action<\u002Fdiv>\n      <div style=\"font-size:20px; line-height:1.35; color:#DBD8E8\">A pre-approved action, routed for sign-off. It never runs wild.<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute; bottom:28px; right:36px; font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:0.08em; color:#8593A0\">Appendix<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Appx · Objections\" data-screen-label=\"A4\" data-speaker-notes=\"Objection-handling reference slide, meant to stand alone if forwarded. Headline is a sentence stem; each card completes it. Four distinct gaps: repeatability (ChatGPT/Claude), scope (incumbent vendor AI), continuity (consultancy), productionisation (own data platform). Strip above the cards keeps ERP/BI/warehouse out of the comparison. Footer band is the one summary claim.\" style=\"background:#F7F9FB; font-family:'Instrument Sans',sans-serif; display:flex; flex-direction:column; padding:0; box-sizing:border-box\">\n  <div style=\"position:absolute; top:0; left:0; width:14px; height:1080px; background:#0A2A43; z-index:1\"><\u002Fdiv>\n\n  <div style=\"display:flex; flex-direction:column; gap:32px; padding:64px 84px 52px; flex:1; min-height:0; justify-content:flex-start\">\n    <div style=\"display:flex; flex-direction:column; gap:16px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:#1E7FB8\">Frequently asked<\u002Fdiv>\n      <div style=\"font-size:84px; line-height:1.1; font-weight:700; letter-spacing:-0.03em; color:#0A2A43; text-wrap:balance\">Why not…<\u002Fdiv>\n      <div style=\"width:120px; height:3px; background:#1E7FB8; margin-top:6px\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:24px; align-items:stretch\">\n      <div style=\"background:#fff; border:1px solid #C9D3DC; border-top:6px solid #1E7FB8; border-radius:10px; padding:28px 26px 30px; display:flex; flex-direction:column; box-shadow:0 6px 20px rgba(10,42,67,0.08)\">\n        <div style=\"font-size:26px; font-weight:700; color:#0A2A43; letter-spacing:-0.01em; min-height:70px\"><span style=\"color:#1E7FB8\">…<\u002Fspan>use ChatGPT or Claude?<\u002Fdiv>\n        <div style=\"border-top:1px solid #C9D3DC; margin-top:14px\"><\u002Fdiv>\n        <div style=\"font-size:21px; line-height:1.4; color:#5A6A78; margin-top:14px; min-height:88px\"><span style=\"font-weight:700; color:#3D4C5A\">Fair:<\u002Fspan> Fast, cheap, already licensed. Your team already uses it.<\u002Fdiv>\n        <div style=\"height:22px\"><\u002Fdiv>\n        <div style=\"font-size:23px; line-height:1.35; font-weight:600; color:#0A2A43\">A chatbot answers once. An app makes the same decision every week, and is auditable and governed.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #C9D3DC; border-top:6px solid #9A431B; border-radius:10px; padding:28px 26px 30px; display:flex; flex-direction:column; box-shadow:0 6px 20px rgba(10,42,67,0.08)\">\n        <div style=\"font-size:26px; font-weight:700; color:#0A2A43; letter-spacing:-0.01em; min-height:70px\"><span style=\"color:#9A431B\">…<\u002Fspan>use AI in your incumbent vendor's platform?<\u002Fdiv>\n        <div style=\"border-top:1px solid #C9D3DC; margin-top:14px\"><\u002Fdiv>\n        <div style=\"font-size:21px; line-height:1.4; color:#5A6A78; margin-top:14px; min-height:88px\"><span style=\"font-weight:700; color:#3D4C5A\">Fair:<\u002Fspan> Native and supported when it ships.<\u002Fdiv>\n        <div style=\"height:22px\"><\u002Fdiv>\n        <div style=\"font-size:23px; line-height:1.35; font-weight:600; color:#0A2A43\">It only sees that vendor's data. The decisions that matter span other systems.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #C9D3DC; border-top:6px solid #1E7FB8; border-radius:10px; padding:28px 26px 30px; display:flex; flex-direction:column; box-shadow:0 6px 20px rgba(10,42,67,0.08)\">\n        <div style=\"font-size:26px; font-weight:700; color:#0A2A43; letter-spacing:-0.01em; min-height:70px\"><span style=\"color:#1E7FB8\">…<\u002Fspan>use a consultancy?<\u002Fdiv>\n        <div style=\"border-top:1px solid #C9D3DC; margin-top:14px\"><\u002Fdiv>\n        <div style=\"font-size:21px; line-height:1.4; color:#5A6A78; margin-top:14px; min-height:88px\"><span style=\"font-weight:700; color:#3D4C5A\">Fair:<\u002Fspan> Deep domain expertise. They've solved this at other companies.<\u002Fdiv>\n        <div style=\"height:22px\"><\u002Fdiv>\n        <div style=\"font-size:23px; line-height:1.35; font-weight:600; color:#0A2A43\">They usually bring people, not a platform. When the engagement ends, so does the capability.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:1px solid #C9D3DC; border-top:6px solid #9A431B; border-radius:10px; padding:28px 26px 30px; display:flex; flex-direction:column; box-shadow:0 6px 20px rgba(10,42,67,0.08)\">\n        <div style=\"font-size:26px; font-weight:700; color:#0A2A43; letter-spacing:-0.01em; min-height:70px\"><span style=\"color:#9A431B\">…<\u002Fspan>build it on your own data platform?<\u002Fdiv>\n        <div style=\"border-top:1px solid #C9D3DC; margin-top:14px\"><\u002Fdiv>\n        <div style=\"font-size:21px; line-height:1.4; color:#5A6A78; margin-top:14px; min-height:88px\"><span style=\"font-weight:700; color:#3D4C5A\">Fair:<\u002Fspan> You already own the platform and the people. A prototype is quick.<\u002Fdiv>\n        <div style=\"height:22px\"><\u002Fdiv>\n        <div style=\"font-size:23px; line-height:1.35; font-weight:600; color:#0A2A43\">The prototype still needs auditability, governance, and low total cost of ownership at scale.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#0A2A43; padding:34px 100px; display:flex; align-items:center; justify-content:space-between; gap:24px; z-index:1\">\n    <div style=\"font-size:27px; line-height:1.3; font-weight:600; color:#fff; max-width:1500px\">xVector is the layer that decides and acts, on top of the systems you already run.<\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:0.08em; color:rgba(255,255,255,0.5); flex:none\">Appendix<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
